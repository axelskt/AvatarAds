/* Audit 04/10 (CC-1) : écran « Ce n'est pas moi » — rétablit l'adresse de connexion (POST auth-otp email_change_revert,
   sans session : la preuve est le jeton reçu à l'ancienne adresse). Le serveur rétablit l'adresse, ferme toutes les
   sessions, retire mot de passe / compte Google / double authentification ajoutés depuis le changement et coupe Claude. */
function Revert({ token }) {
  const mob = window.useIsMobile ? window.useIsMobile() : false;
  const [etat, setEtat] = useStateA("idle"); // idle | busy | done | fin (lien inutilisable)
  const [msg, setMsg] = useStateA("");
  const [adr, setAdr] = useStateA("");
  const [verrou, setVerrou] = useStateA(true); // Audit 04/10 (relecture) : sessions_closed renvoyé par le serveur
  const C = _AA_DARK ?
  { card: "rgba(22,20,25,.78)", line: "rgba(255,255,255,.12)", ink: "#F6F4F1", sub: "#A7A39E", btn: "#1E1B21" } :
  { card: "rgba(255,255,255,.82)", line: "rgba(0,0,0,.12)", ink: "#141013", sub: "#5b5750", btn: "#fff" };
  async function retablir() {
    if (etat === "busy") return;
    setEtat("busy");setMsg("");
    const res = await otpCall({ action: "email_change_revert", token: token });
    if (res && res.ok) {
      setAdr(typeof res.email === "string" ? res.email : "");
      // Audit 04/10 (relecture) : verrouillage non confirmé (sessions_closed:false) → ne jamais affirmer que tout est déconnecté.
      if (res.sessions_closed === false) {setVerrou(false);setMsg("We couldn’t confirm that your open sessions were logged out. Write to us right away at bonjour@avatarads.fr so we can secure your account.");}
      try {await Promise.race([sb.auth.signOut({ scope: "local" }), new Promise((ok) => setTimeout(ok, 3000))]);} catch (e) {}
      try {localStorage.removeItem("sb-guvwgiejzkiodghywpwj-auth-token");} catch (e) {}
      setEtat("done");return;
    }
    const e = res && res.error;
    if (e === "expired") {setMsg("This link has expired (it’s valid for 72 hours) or has already been used. If someone has taken over your account, write to us right away at bonjour@avatarads.fr.");setEtat("fin");return;}
    if (e === "email_taken") {setMsg("Your previous address is already used by another account: write to us at bonjour@avatarads.fr and we’ll restore your access.");setEtat("fin");return;}
    setMsg(e === "too_many_attempts" ? "Too many attempts from this network: try again in an hour." : e === "network" ? "The server’s response didn’t arrive: the restore may already have happened. Try logging in with your previous address; otherwise write to us at bonjour@avatarads.fr." : "The restore didn’t go through. Try again in a moment; if it keeps happening, write to us at bonjour@avatarads.fr.");
    setEtat("idle");
  }
  const titre = etat === "done" ? "Address restored" : "Restore your login address";
  const texte = etat === "done" ? verrou ?
  "Your login address is once again " + (adr || "your previous address") + ". All open sessions have been logged out and Claude’s access to your account has been cut. Log in again with an email code." :
  "Your login address is once again " + (adr || "your previous address") + ". Log in again with an email code." :
  "The email address of your AvatarAds account was just changed. If it wasn’t you, restore your address: all open sessions will be logged out, any password or Google account added since will be removed, and Claude’s access to your account will be cut.";
  const card =
  React.createElement("div", { className: "rise col", style: { width: "100%", maxWidth: 400, alignItems: "center", background: C.card, border: "1px solid " + C.line, borderRadius: 24, padding: mob ? "28px 20px 24px" : "34px 30px 28px", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)" } },
  React.createElement("div", { className: "brandmark", style: { marginBottom: 20, color: C.ink } }, React.createElement(Logo, { size: 36 })),
  React.createElement("h1", { className: "display center", style: { fontSize: mob ? 24 : 27, fontWeight: 800, color: C.ink, lineHeight: 1.1 } }, titre),
  React.createElement("p", { className: "center", style: { marginTop: 12, fontSize: 14.5, lineHeight: 1.6, color: C.sub } }, texte),
  etat === "fin" ? null :
  React.createElement("button", { className: "btn btn-primary", disabled: etat === "busy", style: { width: "100%", marginTop: 22, padding: "15px 20px", fontSize: 15, fontWeight: 800, opacity: etat === "busy" ? .7 : 1 },
    onClick: () => etat === "done" ? location.href = "/en/connexion.html" : retablir() },
  etat === "done" ? "Log in" : etat === "busy" ? "Restoring…" : "Restore my address", " ", React.createElement(Icons.arrow, { size: 16 })),
  msg ? React.createElement("p", { className: "center", style: { fontSize: 13, lineHeight: 1.55, color: "#c0341d", marginTop: 14 } }, msg) : null,

  etat === "fin" ? "Go to login" : "It was me: ignore") : null

}
