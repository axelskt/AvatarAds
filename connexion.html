   sans session : la preuve est le jeton reçu à l'ancienne adresse). Le serveur rétablit l'adresse, ferme toutes les
   sessions, retire mot de passe / compte Google / double authentification ajoutés depuis le changement et coupe Claude. */
function Revert({ token }) {
  const mob = window.useIsMobile ? window.useIsMobile() : false;
  const [etat, setEtat] = useStateA("idle"); // idle | busy | done | fin (lien inutilisable)
  const [msg, setMsg] = useStateA("");
  const [adr, setAdr] = useStateA("");

  { card: "rgba(255,255,255,.82)", line: "rgba(0,0,0,.12)", ink: "#141013", sub: "#5b5750", btn: "#fff" };
  async function retablir() {
    if (etat === "busy") return;
    setEtat("busy");setMsg("");
    const res = await otpCall({ action: "email_change_revert", token: token });
    if (res && res.ok) {
      setAdr(typeof res.email === "string" ? res.email : "");
      // Audit 04/10 (relecture) : verrouillage non confirmé (sessions_closed:false) → ne jamais affirmer que tout est déconnecté.
      if (res.sessions_closed === false) {setVerrou(false);setMsg("La déconnexion des sessions ouvertes n'a pas pu être confirmée. Écris-nous tout de suite à bonjour@avatarads.fr pour qu'on sécurise ton compte.");}
      try {await sb.auth.signOut({ scope: "local" });} catch (e) {}
      setEtat("done");return;
    }
    const e = res && res.error;
    if (e === "expired") {setMsg("Ce lien a expiré (il est valable 72 heures) ou a déjà servi. Si quelqu'un a pris ton compte, écris-nous tout de suite à bonjour@avatarads.fr.");setEtat("fin");return;}
    if (e === "email_taken") {setMsg("Ton ancienne adresse est déjà utilisée par un autre compte : écris-nous à bonjour@avatarads.fr, on rétablit ton accès.");setEtat("fin");return;}
    setMsg(e === "too_many_attempts" ? "Trop de tentatives depuis ce réseau : réessaie dans une heure." : "Le rétablissement n'a pas abouti. Réessaie dans un instant ; si ça persiste, écris-nous à bonjour@avatarads.fr.");
    setEtat("idle");
  }

  const texte = etat === "done" ? verrou ?
  "Ton adresse de connexion est de nouveau " + (adr || "ton ancienne adresse") + ". Toutes les sessions ouvertes ont été déconnectées et l'accès de Claude à ton compte a été coupé. Reconnecte-toi par code email." :
  "Ton adresse de connexion est de nouveau " + (adr || "ton ancienne adresse") + ". Reconnecte-toi par code email." :
  "L'adresse email de ton compte AvatarAds vient d'être changée. Si ce n'est pas toi, rétablis ton adresse : toutes les sessions ouvertes seront déconnectées, un mot de passe ou un compte Google ajouté depuis sera retiré, et l'accès de Claude à ton compte sera coupé.";
  const card =

  React.createElement("div", { className: "brandmark", style: { marginBottom: 20, color: C.ink } }, React.createElement(Logo, { size: 36 })),

    onClick: () => etat === "done" ? location.href = "/connexion.html" : retablir() },
  etat === "done" ? "Me connecter" : etat === "busy" ? "Rétablissement…" : "Rétablir mon adresse", " ", React.createElement(Icons.arrow, { size: 16 })),
