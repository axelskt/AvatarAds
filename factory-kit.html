<script>
(function () {

  var SUPABASE_URL = 'https://guvwgiejzkiodghywpwj.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Y8a0bHB-noCva13tLH26zQ_DjKC29Ck'; // clé publishable (publique)

  var ACCTS = [{ id: 'avataradss', c: 'var(--acc)' }, { id: 'leoadsia', c: 'var(--a2)' }, { id: 'ialebd.axel', c: 'var(--a3)' }];   // un compte à la fois ; @ialebd.axel = A1 + A2 mélangés (Axel 06/10)
  var DEMO = /[?&]demo=1\b/.test(location.search);   // aperçu sans base (vérification de l'écran)

  var IC = {
    send: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>',

    alert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>'
  };

  var sb = null;
  var S = { posts: [], acct: 'avataradss', view: 'todo', cur: null, busy: false, err: '', one: {} };  // one[post] = vidéo seule (téléphone)
  try { var saved = localStorage.getItem('kit_acct'); if (saved) S.acct = saved; } catch (e) { /* stockage bloqué */ }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var fmt = function (iso, o) { return new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: TZ }, o)).format(new Date(iso)); };
  var hour = function (iso) { return fmt(iso, { hour: '2-digit', minute: '2-digit' }); };
  var dayKey = function (iso) { return fmt(iso, { year: 'numeric', month: '2-digit', day: '2-digit' }); };
  var dayLabel = function (iso) { var s = fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  function toast(html, undo) {
    var t = $('toast');
    t.innerHTML = '<span>' + html + '</span>' + (undo ? '<button type="button" id="tUndo">Annuler</button>' : '');
    t.hidden = false;
    if (undo) $('tUndo').onclick = function () { t.hidden = true; undo(); };
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { t.hidden = true; }, undo ? 6000 : 2200);
  }

  // 19/10 (Axel : « plus de programmation, je mets en brouillon et je poste à la main ; les créneaux tu peux les supprimer ») :
  // plus d'heures, seulement le jour et l'ordre ; « C'est posté » (statut 'scheduled' en base = fait, rattaché aux stats).
  var VIEWS = [['todo', 'À préparer'], ['old', 'En brouillon / postées']];
  var now = function () { return new Date().toISOString(); };
  // Posts « skipped » (sortis du kit : stock commun BloxAI, 16/10) jamais comptés : ni « programmées », ni dans les numéros.
  function mine(a) { return S.posts.filter(function (p) { return p.account === (a || S.acct) && p.status !== 'skipped'; }); }
  function todo(a) { return mine(a).filter(function (p) { return p.status === 'todo'; }); }
  // Programmées = validées et encore à venir ; Anciennes = validées dont l'heure est passée (déjà en ligne).
  function inView(p, v) {
    if (v === 'todo') return p.status === 'todo';
    return p.status !== 'todo' && p.status !== 'skipped';
  }
  function viewList(v) { var l = mine().filter(function (p) { return inView(p, v || S.view); }); return (v || S.view) === 'old' ? l.reverse() : l; }
  // Numéro d'ordre dans le compte, fixé par la date prévue : le même que dans le nom du fichier envoyé au téléphone.
  function num(p) { return mine(p.account).indexOf(p) + 1; }
  // Identifiant complet de la vidéo = nom du fichier final (avatar-hook-liaison-démo-CTA) : c'est lui qu'on recherche plus tard.
  function vidId(p) { return decodeURIComponent(String(p.video_url || '').split('?')[0].split('/').pop().replace(/\.mp4$/i, '')); }
  function fileName(p) {
    return pad(num(p)) + '-' + p.account + '-' + fmt(p.scheduled_at, { weekday: 'short' }).replace('.', '') + '-' + fmt(p.scheduled_at, { day: '2-digit' }) + '.mp4';
  }
  // Photos (iPhone) trie les vidéos reçues par leur date de création interne (atome mvhd du MP4), pas par nom de fichier :
  // on la réécrit avant l'envoi, n°01 la plus ancienne puis une minute d'écart, toutes « récentes » (en bas de la galerie).
  function stampDate(buf, when) {
    var u = new Uint8Array(buf), dv = new DataView(buf), t = Math.floor(when / 1000) + 2082844800;   // secondes depuis 1904
    for (var i = 4; i < u.length - 24; i++) {
      if (u[i] === 0x6d && u[i + 1] === 0x76 && u[i + 2] === 0x68 && u[i + 3] === 0x64) {        // 'mvhd'
        var o = i + 4, v = u[o];
        if (v === 1) { dv.setUint32(o + 4, 0); dv.setUint32(o + 8, t); dv.setUint32(o + 12, 0); dv.setUint32(o + 16, t); }
        else { dv.setUint32(o + 4, t); dv.setUint32(o + 8, t); }
        break;
      }
    }
    return buf;
  }

  // ── une vidéo seule (téléphone) : 1er appui = téléchargement avec progression ; 2e appui = feuille de partage
  //    iOS → « Enregistrer la vidéo » (Photos). Le partage doit partir d'un appui : il ne peut pas suivre le téléchargement.
  //    Une seule vidéo gardée en mémoire à la fois.
  async function prepareOne(p) {
    Object.keys(S.one).forEach(function (k) { if (k !== p.id && S.one[k].state === 'ready') delete S.one[k]; });
    var O = S.one[p.id] = { state: 'loading', pct: 0 };
    render();
    try {
      var r = await fetch(p.video_url, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var total = +r.headers.get('content-length') || 0, got = 0, parts = [], rd = r.body && r.body.getReader && r.body.getReader();
      if (rd) {
        for (;;) {
          var c = await rd.read(); if (c.done) break;
          parts.push(c.value); got += c.value.length;
          var pc = total ? Math.floor(got / total * 100) : 0;
          if (pc !== O.pct) { O.pct = pc; paintOne(p); }
        }
      } else parts.push(new Uint8Array(await r.arrayBuffer()));
      var buf = await new Blob(parts).arrayBuffer(); parts = null;
      if (total && buf.byteLength < total) throw new Error('connexion coupée (' + Math.round(buf.byteLength / 1e6) + ' / ' + Math.round(total / 1e6) + ' Mo)');
      O.file = new File([stampDate(buf, Date.now())], fileName(p), { type: 'video/mp4' });
      O.state = 'ready';
    } catch (e) { O.state = 'error'; O.error = String(e.message || e); }
    render();
  }
  function paintOne(p) {   // progression sans tout redessiner (la liste garde son défilement)
    var b = document.querySelector('[data-act="one"][data-id="' + p.id + '"]');
    if (b) b.lastChild.textContent = 'Téléchargement ' + S.one[p.id].pct + ' %';
  }
  function saveOne(p) {
    var O = S.one[p.id]; if (!O || O.state !== 'ready') return;
    if (navigator.canShare && navigator.canShare({ files: [O.file] })) {
      navigator.share({ files: [O.file] }).then(function () { O.state = 'saved'; O.file = null; render(); toast('Vidéo n°' + num(p) + ' enregistrée'); }, function () {});
    } else {
      var a = document.createElement('a'); a.href = URL.createObjectURL(O.file); a.download = O.file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
      O.state = 'saved'; O.file = null; render();
    }
  }
  function oneBtn(p) {
    if (p.video_deleted_at) return '';
    var O = S.one[p.id];
    if (O && O.state === 'loading') return '<button type="button" class="btn dark" data-act="one" data-id="' + esc(p.id) + '" disabled>' + IC.dl + '<span>Téléchargement ' + O.pct + ' %</span></button>';
    if (O && O.state === 'ready') return '<button type="button" class="btn dark" data-act="one" data-id="' + esc(p.id) + '">' + IC.send + '<span>Enregistrer dans Photos</span></button>';
    if (O && O.state === 'error') return '<button type="button" class="btn ghost" data-act="one" data-id="' + esc(p.id) + '" title="' + esc(O.error) + '">' + IC.dl + '<span>Réessayer</span></button>';
    return '<button type="button" class="btn ghost" data-act="one" data-id="' + esc(p.id) + '">' + IC.dl + '<span>' + (O && O.state === 'saved' ? 'Enregistrée · refaire' : 'Enregistrer') + '</span></button>';
  }

  async function copyText(txt, msg) {
    try { await navigator.clipboard.writeText(txt || ''); toast(msg); } catch (e) { toast('Copie refusée par le navigateur'); }
  }

  // Écrit le statut de plusieurs posts d'un coup ; revient en arrière si la base refuse.
  async function setStatus(list, status) {
    var prev = list.map(function (p) { return { p: p, status: p.status, done_at: p.done_at }; });
    var at = status === 'todo' ? null : now();
    list.forEach(function (p) { p.status = status; p.done_at = at; });
    if (!S.example && list.length) {
      var r = await sb.from('factory_posts').update({ status: status, done_at: at }).in('id', list.map(function (p) { return p.id; }));
      if (r.error) { prev.forEach(function (x) { x.p.status = x.status; x.p.done_at = x.done_at; }); toast('Non enregistré : ' + esc(r.error.message)); render(); return false; }
    }
    return true;
  }
  // Stockage (Axel 30/09 : disque plein) : une vidéo programmée n'a plus besoin d'être gardée → son MP4 est supprimé de
  // Supabase 6,5 s après « 15 vidéos programmées » (le temps d'« Annuler ») ; la recette reste pour la ré-assembler.
  function releaseLater(list) {
    if (S.example) return;
    setTimeout(async function () {
      var ids = list.filter(function (p) { return p.status !== 'todo' && !p.video_deleted_at; }).map(function (p) { return p.id; });
      if (!ids.length) return;
      try {
        var tok = (await sb.auth.getSession()).data.session.access_token;
        var r = await fetch(SUPABASE_URL + '/functions/v1/factory-release', { method: 'POST', headers: { Authorization: 'Bearer ' + tok, apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: ids }) });
        var b = await r.json().catch(function () { return {}; });
        (b.done || []).forEach(function (id) { var p = S.posts.find(function (x) { return x.id === id; }); if (p) p.video_deleted_at = new Date().toISOString(); });
        (b.done || []).forEach(function (id) { var c = document.querySelector('.post[data-pid="' + id + '"] video'); if (c) c.outerHTML = '<div class="gone">vidéo<br>retirée du<br>stockage</div>';
          var o = document.querySelector('[data-act="one"][data-id="' + id + '"]'); if (o) o.remove(); });
        if (b.released) toast(b.released + ' vidéo' + (b.released > 1 ? 's' : '') + ' retirée' + (b.released > 1 ? 's' : '') + ' du stockage');
      } catch (e) { /* on réessaiera au prochain clic */ }
      rechargeSoon();
    }, 6500);
  }
  // 16/10 (Axel : « un seul stock pour tout le monde ») : le kit garde 7 jours d'avance et se recharge depuis le stock
  // commun BloxAI (edge function kit-recharge, aussi lancée chaque nuit par pg_cron). Ici : une recharge après
  // « N vidéos programmées », une fois le délai d'annulation passé (une seule recharge à la fois ; le serveur a aussi son
  // verrou), puis la liste est relue si des vidéos ont été ajoutées. Résultat en une ligne sous le titre.
  var KIT = { timer: 0, busy: false, tries: 0, hide: 0 };
  function kitLine(kind, msg) {
    var el = $('kitline'); if (!el) return;
    clearTimeout(KIT.hide);
    el.className = 'kitline ' + kind;
    el.innerHTML = (kind === 'busy' ? IC.sync : kind === 'err' || kind === 'warn' ? IC.alert : IC.check) + '<span>' + esc(msg) + '</span>';
    el.hidden = false;
    if (kind === 'ok') KIT.hide = setTimeout(function () { el.hidden = true; }, 20000);
  }
  function rechargeSoon(delay) {
    if (S.example) return;
    clearTimeout(KIT.timer);
    KIT.timer = setTimeout(recharge, delay == null ? 1500 : delay);
  }
  async function recharge() {
    if (KIT.busy) return;   // une recharge en cours couvre déjà tout le kit
    KIT.busy = true;
    kitLine('busy', 'Recharge du kit depuis le stock…');
    try {
      var ses = (await sb.auth.getSession()).data.session;
      if (!ses) { KIT.busy = false; return kitLine('err', 'Recharge du kit impossible : session expirée, recharge la page'); }
      var r = await fetch(SUPABASE_URL + '/functions/v1/kit-recharge', { method: 'POST', headers: { Authorization: 'Bearer ' + ses.access_token, apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}' });
      var b = await r.json().catch(function () { return {}; });
      if (r.status === 409 && b.busy && KIT.tries < 3) {   // une autre recharge tourne (cron, autre appareil) : on réessaie
        KIT.tries++; KIT.busy = false;
        kitLine('busy', 'Une recharge est déjà en cours, nouvel essai dans 15 s…');
        return rechargeSoon(15000);
      }
      KIT.tries = 0;
      // vidéos dont le retrait du stock BloxAI est resté incertain : revérifiées par la recharge suivante (journal serveur)
      var chk = Array.isArray(b.to_check) ? b.to_check.length : 0;
      var later = chk ? ' · ' + chk + ' vidéo' + (chk > 1 ? 's' : '') + ' à revérifier, reprise' + (chk > 1 ? 's' : '') + ' à la prochaine recharge' : '';
      if (!r.ok || b.error) kitLine('err', 'Recharge du kit impossible : ' + (b.error || 'erreur ' + r.status) + later);
      else { kitLine(chk ? 'warn' : 'ok', b.message || 'Kit rechargé.'); if (b.added) refreshSoon(); }   // à revérifier : la ligne reste
    } catch (e) { KIT.tries = 0; kitLine('err', 'Recharge du kit impossible : connexion coupée'); }
    KIT.busy = false;
  }
  // Relit la liste sans écraser une série en cours d'enregistrement ni sa fenêtre « Annuler ».
  function refreshSoon() {
    if (marking || Date.now() < (S.undoUntil || 0)) return setTimeout(refreshSoon, 1500);
    load();
  }
  // 15/10 (Axel : « je les fais de 15 en 15, c'est le max pour Instagram ») : un seul bouton marque les 15 prochaines
  // vidéos du compte comme programmées. Réaction immédiate (les cartes glissent hors de la liste), enregistrement en
  // arrière-plan ; « Annuler » pendant 6 s ; si la base refuse, retour à l'état d'avant + message.
  var marking = false;
  function nextBatch() { return todo().slice(0, 15); }
  // 18/10 (Axel) : « C'est programmé » de retour sur chaque carte — même mécanique que le paquet de 15, pour une vidéo.
  function markNext(one) {
    var list = one ? [one] : nextBatch();
    if (!list.length || (marking && !one)) return;
    if (!one) marking = true; S.undoUntil = Date.now() + 6500;
    var cards = list.map(function (p) { return document.querySelector('.post[data-pid="' + p.id + '"]'); }).filter(Boolean);
    list.forEach(function (p) { p.status = 'scheduled'; p.done_at = now(); });
    var n = todo()[0]; S.cur = n ? n.id : null;
    cards.forEach(function (c) { c.style.maxHeight = c.offsetHeight + 'px'; });
    void document.body.offsetHeight;
    cards.forEach(function (c) { c.classList.add('leaving'); });
    setTimeout(render, cards.length ? 420 : 0);
    var label = one ? 'N°' + num(one) + ' en brouillon' : list.length + ' vidéo' + (list.length > 1 ? 's' : '') + ' en brouillon';
    toast(label, function () { setStatus(list, 'todo').then(function (ok) { if (ok) { S.cur = list[0].id; render(); } }); });
    setStatus(list, 'scheduled').then(function (ok) {   // setStatus remet l'ancien état et redessine si la base refuse
      if (!one) marking = false;
      if (ok) releaseLater(list);
    });
  }

  function acctCard(A) {
    var all = mine(A.id), left = todo(A.id).length;
    return '<button type="button" class="acct" style="--c:' + A.c + '" data-act="acct" data-a="' + A.id + '" aria-pressed="' + (S.acct === A.id) + '">'
      + '<span class="n"><i></i>@' + A.id + '</span><span class="m">' + (all.length - left) + ' / ' + all.length + ' en brouillon · ' + left + ' à préparer</span>'
      + '<span class="bar"><i style="width:' + (all.length ? Math.round((all.length - left) / all.length * 100) : 0) + '%"></i></span></button>';
  }

  function bulkHTML() {
    var T = todo(), list = nextBatch();
    if (S.view !== 'todo' || !list.length) return '';
    var first = list[0], last = list[list.length - 1];
    return '<div class="send"><div class="send-h"><div><b>' + T.length + ' vidéo' + (T.length > 1 ? 's' : '') + ' à préparer</b>'
      + '<div class="meta">Les ' + (list.length > 1 ? list.length + ' prochaines' : 'prochaine') + ' : n° ' + pad(num(first)) + (list.length > 1 ? ' → ' + pad(num(last)) : '')
      + ' · ' + esc(dayLabel(first.scheduled_at))
      + (list.length > 1 && dayKey(last.scheduled_at) !== dayKey(first.scheduled_at) ? ' → ' + esc(dayLabel(last.scheduled_at)) : '') + '</div></div>'
      + '<button type="button" class="btn ok" data-act="next15">' + IC.check + list.length + ' vidéo' + (list.length > 1 ? 's' : '') + ' en brouillon</button></div></div>';
  }

  // 19/10 : démo de la vidéo (repartir.py les fait tourner : jamais deux fois la même de suite)
  var FAM = [['C-OMNI', 'Omni'], ['C-EXP', 'Express'], ['C-MCP', 'Claude'], ['C-CLAUDE', 'Claude'], ['C-MC', 'Motion Control'], ['C-SADS', 'Pubs statiques'], ['C-IMGIA', 'Images IA']];
  function famOf(c) {
    c = c || {}; var d = String(c.contenu || ''), f = FAM.filter(function (x) { return d.indexOf(x[0]) === 0; })[0];
    return (f ? f[1] : 'Démo') + (c.format === 'F05' ? ' · sans voix' : ' · parlée');
  }
  function postHTML(p) {
    var done = p.status !== 'todo', id = vidId(p);
    return '<div class="post' + (done ? ' is-done' : '') + (p.id === S.cur ? ' cur' : '') + '" data-pid="' + esc(p.id) + '">'
      + '<span class="no">' + num(p) + '</span>'
      + (p.video_deleted_at ? '<div class="gone">vidéo<br>retirée du<br>stockage</div>'
        : '<video src="' + esc(p.video_url) + '" poster="' + esc(String(p.video_url).replace(/\.mp4$/, '-poster.jpg')) + '" muted playsinline preload="none" data-act="play"></video>')   // 07/10 : affiche JPEG (Safari laissait des cases noires en chargeant 70 vidéos)
      + '<div style="min-width:0"><div class="t">' + esc(dayLabel(p.scheduled_at)) + '</div><div class="d">' + esc(famOf(p.combo)) + '</div>'
      + '<div class="c">' + esc(p.caption || '(pas de légende)') + '</div>'
      + '<div class="id">ID ' + esc(id) + '<button type="button" data-act="copyid" data-id="' + esc(p.id) + '" title="Copier l’ID">' + IC.copy + '</button></div></div>'
      + '<div class="act">' + oneBtn(p) + '<button type="button" class="btn ghost" data-act="copy" data-id="' + esc(p.id) + '">' + IC.copy + 'Copier la légende</button>'
      + (done ? '' : '<button type="button" class="btn ok" data-act="done" data-id="' + esc(p.id) + '">' + IC.check + 'En brouillon</button>')   // 18/10 : de retour sur chaque vidéo
      + '</div>'
      + '</div>';
  }

  function render() {
    var app = $('app');
    if (S.err) { app.innerHTML = '<div class="card empty"><b>Impossible de charger</b>' + esc(S.err) + '</div>'; return; }
    var list = viewList(), out = '', last = '';
    list.forEach(function (p) {
      var k = dayKey(p.scheduled_at);
      if (k !== last) {
        var dd = list.filter(function (x) { return dayKey(x.scheduled_at) === k; });
        out += (last ? '</div>' : '') + '<h2>' + esc(dayLabel(p.scheduled_at)) + ' · ' + dd.length + '</h2><div class="list">';
        last = k;
      }
      out += postHTML(p);
    });
    if (last) out += '</div>';
    var EMPTY = { todo: mine().length ? 'Tout est en brouillon sur @' + S.acct : 'Aucun post prévu sur @' + S.acct,
      old: 'Aucune vidéo en brouillon ou postée' };
    if (!list.length) out = '<div class="card empty" style="margin-top:14px"><b>' + esc(EMPTY[S.view]) + '</b>'
      + (S.view === 'todo' && !mine().length ? 'Les posts apparaissent ici dès que les vidéos finales sont assemblées et planifiées.' : '') + '</div>';
    var tabs = '<div class="tabs">' + VIEWS.map(function (v) {
      return '<button type="button" class="tab" data-act="view" data-v="' + v[0] + '" aria-pressed="' + (S.view === v[0]) + '">' + v[1] + ' · ' + mine().filter(function (p) { return inView(p, v[0]); }).length + '</button>';
    }).join('') + '</div>';
    app.innerHTML = '<div class="accts">' + ACCTS.map(acctCard).join('') + '</div>' + tabs + bulkHTML() + out;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), i = +el.getAttribute('data-i');
    var p = id && S.posts.find(function (x) { return x.id === id; });
    if (act === 'acct') { S.acct = el.getAttribute('data-a'); try { localStorage.setItem('kit_acct', S.acct); } catch (x) { /* */ } var f = todo()[0]; S.cur = f ? f.id : null; render(); }
    else if (act === 'view') { S.view = el.getAttribute('data-v'); render(); }
    else if (act === 'next15') markNext();
    else if (act === 'done' && p && p.status === 'todo') markNext(p);
    else if (act === 'one' && p) { var O = S.one[p.id]; S.cur = p.id; if (O && O.state === 'ready') saveOne(p); else if (!O || O.state !== 'loading') prepareOne(p); }
    else if (act === 'copy' && p) { S.cur = p.id; copyText(p.caption, 'Légende n°' + num(p) + ' copiée'); render(); }
    else if (act === 'copyid' && p) copyText(vidId(p), 'ID copié');
    else if (act === 'play') { if (el.paused) { el.muted = false; el.play(); } else el.pause(); }
  });

  async function load() {
    // 90 derniers jours (onglet Postées) à +33 jours.
    var from = new Date(Date.now() - 90 * 86400000).toISOString(), to = new Date(Date.now() + 33 * 86400000).toISOString();   // 19/10 : kit à J+30
    var r = await sb.from('factory_posts').select('id, scheduled_at, platform, account, video_url, caption, status, done_at, combo, video_deleted_at')
      .eq('platform', 'instagram').gte('scheduled_at', from).lte('scheduled_at', to).order('scheduled_at').order('id');
    if (r.error) { S.err = r.error.message; render(); return; }
    S.posts = r.data || [];
    if (!S.posts.length) { S.example = true; S.posts = examples(); }   // aperçu de l'écran tant qu'aucun post n'est planifié
    var f = todo()[0]; S.cur = f ? f.id : null;
    render();
  }

  function loginHTML(msg) {
    $('app').innerHTML = '<div class="card login"><b>Connexion</b><span class="meta">Réservé au propriétaire. Un code arrive par e-mail.</span>'
      + '<input id="lEmail" type="email" autocomplete="email" placeholder="E-mail">'
      + '<input id="lCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu" hidden>'
      + '<button type="button" class="btn dark" id="lGo">Recevoir le code</button><span class="meta">' + esc(msg || '') + '</span></div>';
    var step = 0;
    $('lGo').onclick = async function () {
      var email = $('lEmail').value.trim();
      if (!step) {
        var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false } });
        if (r.error) return loginHTML(r.error.message);
        step = 1; $('lCode').hidden = false; $('lGo').textContent = 'Se connecter'; $('lCode').focus();
      } else {
        var v = await sb.auth.verifyOtp({ email: email, token: $('lCode').value.trim(), type: 'email' });
        if (v.error) return loginHTML(v.error.message);
        boot(v.data.session);
      }
    };
  }

  async function boot(session) {
    if (!session) return loginHTML();
    var a = await sb.rpc('factory_access');
    if (a.error || !a.data || !a.data.ok) { try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} return loginHTML('Accès réservé au propriétaire : reconnecte-toi avec le compte propriétaire.'); }
    load();
  }

  function examples() {
    var base = 'https://guvwgiejzkiodghywpwj.supabase.co/storage/v1/object/public/factory-media/variants/';
    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    var mk = function (d, h, acct, v, cap, st) { var t = new Date(d0.getTime() + d * 86400000 + h * 3600000); return { id: 'd' + d + h + acct, scheduled_at: t.toISOString(), account: acct, video_url: base + v + '.mp4', caption: cap, status: st || 'todo' }; };
    var C = {
      direct: 'Va sur avatarads.fr et teste par toi-même.',
      ugc: 'Commente « UGC » et je t’envoie un guide complet pour faire la même chose.',
      lien: 'Tu peux maintenant créer du contenu en deux clics, sans te filmer, pour seulement un café par jour. Commente « SITE » et je t’envoie le lien pour faire la même chose.',
      dm: 'Commente ce que tu veux sous cette vidéo et je t’envoie le lien en DM.',
      plan: 'Commente « PLAN » et je t’envoie la configuration exacte que j’utilise.'
    };
    return [
      mk(-2, 12, 'avataradss', 'A1-8-H24-v2', C.lien + '\n\n#ia #contenu #video', 'scheduled'),
      mk(-2, 13, 'leoadsia', 'A2-3-H24-v2', C.dm + '\n\n#ia #video #createur', 'scheduled'),
      mk(1, 12, 'avataradss', 'A1-5-H29', C.plan + '\n\n#ia #ugc #marketing', 'scheduled'),
      mk(1, 13, 'leoadsia', 'A2-8-L12', C.ugc + '\n\n#ugc #ia #pub'),
      mk(1, 17, 'avataradss', 'A1-5-CTA-direct', C.direct + '\n\n#ia #contenu'),
      mk(1, 19, 'leoadsia', 'A2-2-CTA-UGC', C.ugc + '\n\n#ugc #ia #createur'),
      mk(1, 21, 'avataradss', 'A1-2-H24-v2', C.lien + '\n\n#ia #video #contenu'),
      mk(2, 12, 'avataradss', 'A1-5-H29', C.plan + '\n\n#ia #marketing'),
      mk(2, 13, 'leoadsia', 'A2-1-H24-v2', C.dm + '\n\n#ia #video')
    ];
  }
  if (DEMO) { S.example = true; S.posts = examples(); S.cur = todo()[0].id; render(); return; }

  // 13/10 : même session que Creative Factory (clé sb-cf-v2-auth, 11/10) — la session de l'app peut être un autre compte
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-cf-v2-auth' } }); } catch (e) { sb = null; }
  if (!sb) { S.err = 'supabase-js n’a pas pu être chargé.'; return render(); }
  sb.auth.getSession().then(function (r) { boot(r && r.data && r.data.session); }, function () { loginHTML(); });
})();
</script>
</body>
</html>
