<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kit de publication</title>
<link rel="icon" href="/favicon.png">
<!-- Kit de publication (29/09/2026). Axel programme lui-même ses reels dans l'app Instagram (programmation native :
     musique tendance possible, jamais d'API de publication). Un post à la fois : enregistrer la vidéo, coller la
     légende, régler l'heure, valider « programmé » → post suivant. Table factory_posts (RLS owner/dev). -->
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#15140f; --dim:#6f6c64; --line:#e6e3dc; --soft:#efede7;
  --acc:#ff5a1f; --ok:#16a34a; --okbg:#e8f6ed; --warn:#b45309; --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f0f0e; --card:#1a1a18; --ink:#f3f2ee; --dim:#9a978f; --line:#2c2b28; --soft:#232320; --okbg:#10291a; }
}
:root[data-theme="dark"]{ --bg:#0f0f0e; --card:#1a1a18; --ink:#f3f2ee; --dim:#9a978f; --line:#2c2b28; --soft:#232320; --okbg:#10291a; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
.top a{color:var(--dim);font-size:13px;text-decoration:none}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.meta{color:var(--dim);font-size:13px}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.when{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.when b{font-size:26px;letter-spacing:-.02em}
.acct{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.acct i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.acct.a2 i{background:#6d5dfc}
.day{color:var(--dim);font-size:14px;margin-top:2px}
.vid{margin:12px 0;border-radius:14px;overflow:hidden;background:#000;height:40vh;max-height:420px;display:flex;justify-content:center}
.vid video{height:100%;width:100%;object-fit:contain;background:#000}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:650;font-size:16px;background:var(--soft)}
.btn svg{flex:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.okbg{background:var(--okbg)}
.btn.ghost{background:transparent;border:1px solid var(--line);font-weight:500;font-size:14px;padding:11px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{flex:1}
.cap{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;font-size:14px;max-height:170px;overflow:auto;background:var(--bg)}
.step{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12.5px;margin:12px 0 6px}
.step span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-weight:700;font-size:11px;color:var(--ink)}
.done-tag{color:var(--ok);font-weight:650}
.empty{text-align:center;padding:34px 18px;color:var(--dim)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
h2{font-size:14px;margin:22px 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li.cur{border-color:var(--ink)}
.li .t{font-weight:650;min-width:46px}
.li .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.scheduled,.dot.published{background:var(--ok);border-color:var(--ok)}
.dot.skipped{background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast span{white-space:nowrap}
.toast button{background:none;border:0;color:var(--acc);font-weight:700;padding:0}
.login{display:flex;flex-direction:column;gap:10px}
.login input{font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Kit de publication</h1><a href="factory-v2.html">Tableau de bord</a></div>
  <div id="app"><div class="empty">Chargement…</div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://guvwgiejzkiodghywpwj.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Y8a0bHB-noCva13tLH26zQ_DjKC29Ck'; // clé publishable (publique)
  var TZ = 'Europe/Paris';
  var DEMO = /[?&]demo=1\b/.test(location.search);   // aperçu sans base (vérification de l'écran)

  var IC = {
    save: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
    copy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'
  };

  var sb = null, S = { posts: [], cur: null, acct: 'all', blobs: {}, busy: false, err: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var fmt = function (iso, o) { return new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: TZ }, o)).format(new Date(iso)); };
  var hour = function (iso) { return fmt(iso, { hour: '2-digit', minute: '2-digit' }); };
  var dayKey = function (iso) { return fmt(iso, { year: 'numeric', month: '2-digit', day: '2-digit' }); };
  var dayLabel = function (iso) { var s = fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };

  function toast(html, undo) {
    var t = $('toast');
    t.innerHTML = '<span>' + html + '</span>' + (undo ? '<button type="button" id="tUndo">Annuler</button>' : '');
    t.hidden = false;
    if (undo) $('tUndo').onclick = function () { t.hidden = true; undo(); };
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { t.hidden = true; }, undo ? 6000 : 2200);
  }

  function visible() { return S.posts.filter(function (p) { return S.acct === 'all' || p.account === S.acct; }); }
  function nextTodo(after) {
    var v = visible().filter(function (p) { return p.status === 'todo'; });
    if (after) { var i = v.findIndex(function (p) { return p.scheduled_at > after.scheduled_at || (p.scheduled_at === after.scheduled_at && p.id > after.id); }); if (i > -1) return v[i]; }
    return v[0] || null;
  }

  // La vidéo est téléchargée dès que la carte s'affiche : au tap, le partage part tout de suite (Safari n'autorise
  // navigator.share que pendant le geste, pas après un téléchargement de plusieurs secondes).
  function prefetch(p) {
    if (!p || S.blobs[p.id]) return;
    S.blobs[p.id] = fetch(p.video_url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(function (b) { S.blobs[p.id] = b; render(); return b; })
      .catch(function () { delete S.blobs[p.id]; });
  }
  function fileName(p) { return p.account + '-' + fmt(p.scheduled_at, { month: '2-digit', day: '2-digit' }).replace('/', '-') + '-' + hour(p.scheduled_at).replace(':', 'h') + '.mp4'; }

  async function copyCaption(p, quiet) {
    try { await navigator.clipboard.writeText(p.caption || ''); if (!quiet) toast('Légende copiée'); return true; }
    catch (e) { if (!quiet) toast('Copie refusée : sélectionne le texte à la main'); return false; }
  }

  // Un seul tap : la légende part dans le presse-papiers ET la vidéo s'ouvre dans la feuille de partage
  // (« Enregistrer la vidéo » sur iPhone). Sans partage de fichiers (ordinateur) : simple téléchargement.
  function saveVideo(p) {
    var b = S.blobs[p.id];
    copyCaption(p, true);
    if (b instanceof Blob) {
      var f = new File([b], fileName(p), { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f] }).then(function () { toast('Vidéo prête · légende copiée'); }, function () {});
        return;
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = fileName(p); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('Vidéo téléchargée · légende copiée');
      return;
    }
    window.open(p.video_url, '_blank', 'noopener');
    toast('Vidéo ouverte · légende copiée');
  }

  async function setStatus(p, status) {
    var prev = { status: p.status, done_at: p.done_at };
    p.status = status; p.done_at = status === 'todo' ? null : new Date().toISOString();
    if (!DEMO) {
      var r = await sb.from('factory_posts').update({ status: p.status, done_at: p.done_at }).eq('id', p.id);
      if (r.error) { p.status = prev.status; p.done_at = prev.done_at; toast('Non enregistré : ' + esc(r.error.message)); render(); return false; }
    }
    return true;
  }

  async function markDone(p) {
    if (S.busy) return;
    S.busy = true;
    var ok = await setStatus(p, 'scheduled');
    S.busy = false;
    if (!ok) return;
    var n = nextTodo(p);
    S.cur = n ? n.id : null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Programmé · ' + esc(dayLabel(p.scheduled_at).split(' ')[0]) + ' ' + hour(p.scheduled_at), function () { setStatus(p, 'todo').then(function () { S.cur = p.id; render(); }); });
  }

  function focusHTML(p) {
    if (!p) {
      var left = visible().filter(function (x) { return x.status === 'todo'; }).length;
      return '<div class="card empty"><b>' + (S.posts.length ? 'Tout est programmé' : 'Aucun post prévu pour l’instant') + '</b>'
        + (S.posts.length ? (left ? left + ' post(s) restent sur l’autre compte.' : 'Rien à faire, le prochain kit arrive avec les nouvelles vidéos.')
          : 'Les posts apparaissent ici dès que les vidéos finales sont assemblées et planifiées.') + '</div>';
    }
    var b = S.blobs[p.id], ready = b instanceof Blob, done = p.status !== 'todo';
    return '<div class="card">'
      + '<div class="when"><div><span class="acct' + (p.account === 'leoadsia' ? ' a2' : '') + '"><i></i>@' + esc(p.account) + '</span>'
      + '<div class="day">' + esc(dayLabel(p.scheduled_at)) + '</div></div><b>' + hour(p.scheduled_at) + '</b></div>'
      + '<div class="vid"><video src="' + esc(p.video_url) + '" controls playsinline muted preload="metadata"></video></div>'
      + '<div class="step"><span>1</span>Enregistre la vidéo, la légende se copie en même temps</div>'
      + '<button type="button" class="btn dark" data-act="save">' + IC.save + (ready ? 'Enregistrer la vidéo' : 'Préparation de la vidéo…') + '</button>'
      + '<div class="step"><span>2</span>Dans Instagram : colle la légende, programme à ' + hour(p.scheduled_at) + '</div>'
      + '<div class="cap" id="cap">' + esc(p.caption || '(pas de légende)') + '</div>'
      + '<div class="row"><button type="button" class="btn ghost" data-act="copy">' + IC.copy + 'Recopier la légende</button></div>'
      + '<div class="step"><span>3</span>Une fois programmé dans l’app</div>'
      + (done ? '<div class="row"><div class="btn okbg done-tag">' + IC.check + 'Déjà programmé</div></div><div class="row"><button type="button" class="btn ghost" data-act="undo">Remettre à faire</button><button type="button" class="btn ghost" data-act="next">Suivant</button></div>'
        : '<button type="button" class="btn ok" data-act="done">' + IC.check + 'C’est programmé</button>'
          + '<div class="row"><button type="button" class="btn ghost" data-act="skip">Plus tard</button></div>')
      + '</div>';
  }

  function listHTML() {
    var v = visible(), out = '', last = '';
    v.forEach(function (p) {
      var k = dayKey(p.scheduled_at);
      if (k !== last) {
        var dd = v.filter(function (x) { return dayKey(x.scheduled_at) === k; });
        out += (last ? '</div>' : '') + '<h2>' + esc(dayLabel(p.scheduled_at)) + ' · ' + dd.filter(function (x) { return x.status !== 'todo'; }).length + '/' + dd.length + '</h2><div class="list">';
        last = k;
      }
      out += '<button type="button" class="li' + (p.id === S.cur ? ' cur' : '') + '" data-act="open" data-id="' + esc(p.id) + '"><span class="dot ' + esc(p.status) + '"></span>'
        + '<span class="t">' + hour(p.scheduled_at) + '</span><span class="a">@' + esc(p.account) + ' · ' + esc((p.caption || '').split('\n')[0]) + '</span></button>';
    });
    return out + (last ? '</div>' : '');
  }

  function render() {
    var app = $('app');
    if (S.err) { app.innerHTML = '<div class="card empty"><b>Impossible de charger</b>' + esc(S.err) + '</div>'; return; }
    var v = visible(), done = v.filter(function (p) { return p.status !== 'todo'; }).length;
    var cur = S.posts.find(function (p) { return p.id === S.cur; }) || null;
    var accts = ['all'].concat(Array.from(new Set(S.posts.map(function (p) { return p.account; }))));
    var per = function (a) { var x = S.posts.filter(function (p) { return p.account === a; }); return x.filter(function (p) { return p.status !== 'todo'; }).length + '/' + x.length; };
    app.innerHTML = '<div class="meta">' + done + ' / ' + v.length + ' programmés' + (v.length ? ' · jusqu’au ' + esc(fmt(v[v.length - 1].scheduled_at, { day: 'numeric', month: 'long' })) : '') + '</div>'
      + '<div class="bar"><i style="width:' + (v.length ? Math.round(done / v.length * 100) : 0) + '%"></i></div>'
      + (accts.length > 2 ? '<div class="chips">' + accts.map(function (a) {
        return '<button type="button" class="chip" data-act="acct" data-a="' + esc(a) + '" aria-pressed="' + (S.acct === a) + '">' + (a === 'all' ? 'Tous' : '@' + esc(a) + ' · ' + per(a)) + '</button>';
      }).join('') + '</div>' : '<div style="height:10px"></div>')
      + focusHTML(cur) + listHTML();
    prefetch(cur);
    var n = cur && nextTodo(cur); if (n && S.blobs[cur.id] instanceof Blob) prefetch(n);   // la suivante se prépare pendant qu'il programme
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), cur = S.posts.find(function (p) { return p.id === S.cur; });
    if (act === 'save' && cur) saveVideo(cur);
    else if (act === 'copy' && cur) copyCaption(cur);
    else if (act === 'done' && cur) markDone(cur);
    else if (act === 'undo' && cur) setStatus(cur, 'todo').then(render);
    else if (act === 'skip' || act === 'next') { var n = cur && nextTodo(cur); if (n) { S.cur = n.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } else toast('C’était le dernier'); }
    else if (act === 'open') { S.cur = el.getAttribute('data-id'); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (act === 'acct') { S.acct = el.getAttribute('data-a'); var f = nextTodo(); S.cur = f ? f.id : (visible()[0] || {}).id || null; render(); }
  });

  async function load() {
    // Semaine glissante : d'hier (un post du soir pas encore validé) à +14 jours.
    var from = new Date(Date.now() - 86400000).toISOString(), to = new Date(Date.now() + 14 * 86400000).toISOString();
    var r = await sb.from('factory_posts').select('id, scheduled_at, platform, account, video_url, caption, status, done_at')
      .eq('platform', 'instagram').gte('scheduled_at', from).lte('scheduled_at', to).order('scheduled_at').order('id');
    if (r.error) { S.err = r.error.message; render(); return; }
    S.posts = r.data || [];
    var f = nextTodo(); S.cur = f ? f.id : null;
    render();
  }

  function loginHTML(msg) {
    $('app').innerHTML = '<div class="card login"><b>Connexion</b><span class="meta">Réservé au propriétaire. Un code arrive par e-mail.</span>'
      + '<input id="lEmail" type="email" autocomplete="email" placeholder="E-mail">'
      + '<input id="lCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu" hidden>'
      + '<button type="button" class="btn dark" id="lGo">Recevoir le code</button><span class="meta">' + esc(msg || '') + '</span></div>';
    var step = 0;
    $('lGo').onclick = async function () {
      var email = $('lEmail').value.trim();
      if (!step) {
        var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false } });
        if (r.error) return loginHTML(r.error.message);
        step = 1; $('lCode').hidden = false; $('lGo').textContent = 'Se connecter'; $('lCode').focus();
      } else {
        var v = await sb.auth.verifyOtp({ email: email, token: $('lCode').value.trim(), type: 'email' });
        if (v.error) return loginHTML(v.error.message);
        boot(v.data.session);
      }
    };
  }

  async function boot(session) {
    if (!session) return loginHTML();
    var a = await sb.rpc('factory_access');
    if (a.error || !a.data || !a.data.ok) { S.err = 'Accès réservé au propriétaire.'; return render(); }
    load();
  }

  if (DEMO) {
    var base = 'https://guvwgiejzkiodghywpwj.supabase.co/storage/v1/object/public/factory-media/variants/';
    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    var mk = function (d, h, acct, v, cap) { var t = new Date(d0.getTime() + d * 86400000 + h * 3600000); return { id: 'd' + d + h, scheduled_at: t.toISOString(), account: acct, video_url: base + v + '.mp4', caption: cap, status: 'todo' }; };
    S.posts = [
      mk(1, 12, 'avataradss', 'A1-5-H29', 'Tu crées encore tes pubs à la main ?\n\nCommente GO et je t’envoie l’accès.\n\n#ia #ugc #marketing'),
      mk(1, 13, 'leoadsia', 'A2-6-H24-v2', 'Ce que personne ne te dit sur les vidéos IA.\n\nCommente GO pour tester.\n\n#ia #contenu'),
      mk(1, 17, 'avataradss', 'A1-5-CTA-direct', 'J’ai fait 30 vidéos en une après-midi.\n\nCommente GO.\n\n#ia #ugc'),
      mk(1, 19, 'leoadsia', 'A2-8-L12', 'Mon avatar parle mieux que moi.\n\nCommente GO.\n\n#ia'),
      mk(1, 21, 'avataradss', 'A2-2-CTA-UGC', 'Arrête de payer des créateurs UGC.\n\nCommente GO.\n\n#ugc #ia')
    ];
    S.cur = S.posts[0].id; render(); return;
  }

  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; }
  if (!sb) { S.err = 'supabase-js n’a pas pu être chargé.'; return render(); }
  sb.auth.getSession().then(function (r) { boot(r && r.data && r.data.session); }, function () { loginHTML(); });
})();
</script>
</body>
</html>
