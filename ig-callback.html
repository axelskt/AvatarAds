<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvatarAds · Instagram connection</title>
<style>
  :root{ --bg:#0f0f11; --panel:#17171b; --text:#fff; --muted:#9a9aa2; --ok:#34c759; --accent:#ff6b35; --border:#26262c }
  *{ box-sizing:border-box }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif }
  .card{ width:100%; max-width:420px; background:var(--panel); border:1px solid var(--border);
    border-radius:18px; padding:34px 26px; text-align:center }
  .ic{ width:56px; height:56px; margin:0 auto 16px; display:grid; place-items:center; border-radius:50% }
  h1{ font-size:19px; margin:6px 0 8px }
  .muted{ color:var(--muted); font-size:14px; line-height:1.5; margin:0 }
  .spin{ width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; margin:0 auto 16px; animation:r .8s linear infinite }
  @keyframes r{ to{ transform:rotate(360deg) } }
</style>
</head>
<body>
  <div class="card" id="c">
    <div class="spin"></div>
    <h1>Connecting Instagram…</h1>
    <p class="muted">One moment, we are connecting your account.</p>
  </div>
<script>
  const EDGE = 'https://guvwgiejzkiodghywpwj.supabase.co/functions/v1/instagram-auth';
  const p = new URLSearchParams(location.search);
  const code = p.get('code');
  const state = p.get('state') || '';
  const err = p.get('error_description') || p.get('error');
  const c = document.getElementById('c');
  const CHECK = '<div class="ic" style="background:rgba(52,199,89,.14)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>';
  const CROSS = '<div class="ic" style="background:rgba(255,107,53,.14)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff6b35" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>';
  function show(html){ c.innerHTML = html; }
  // Prévient la page qui a ouvert le popup (ex. ig-review.html, page du reviewer Meta) du résultat,
  // SUCCÈS COMME ÉCHEC, sinon elle reste bloquée sur son chargement. L'aperçu (profil + reach 28 j)
  // vient de l'échange lui-même : seul celui qui vient de s'authentifier le reçoit.
  // Deux canaux : window.opener (cas normal) + BroadcastChannel (même origine), qui fonctionne même si
  // une page de connexion (ex. facebook.com) a coupé le lien opener via COOP.
  // Audit 02/10 : l'échange exige le state signé renvoyé par Instagram ET, pour une connexion owner, la session
  // avatarads.fr (même domaine que le tableau de bord) : on envoie son jeton d'accès s'il existe (jamais stocké ici).
  // Sans session owner, seul le state « relecteur » d'ig-review.html aboutit (aperçu, rien n'est enregistré).
  function sbToken(){
    try {
      const s = JSON.parse(localStorage.getItem('sb-guvwgiejzkiodghywpwj-auth-token') || 'null');
      const t = s && (s.access_token || (s.currentSession && s.currentSession.access_token));
      return (typeof t === 'string' && t.split('.').length === 3) ? t : '';
    } catch(_) { return ''; }
  }
  function notify(msg){
    msg = Object.assign({ source:'ig-oauth' }, msg);
    if (window.opener) { try { window.opener.postMessage(msg, location.origin); } catch(_){} }
    try { const bc = new BroadcastChannel('ig-oauth'); bc.postMessage(msg); bc.close(); } catch(_){}
  }
  if (err) {
    notify({ ok:false, error:'Connection cancelled: ' + err });
    show(CROSS + '<h1>Connection cancelled</h1><p class="muted">' + esc(err) + '</p>');
  } else if (!code) {
    notify({ ok:false, error:'No authorization code received.' });
    show(CROSS + '<h1>Invalid link</h1><p class="muted">No authorization code received.</p>');
  } else {
    const tok = sbToken();
    const headers = { 'Content-Type':'application/json' };
    if (tok) headers.Authorization = 'Bearer ' + tok;
    fetch(EDGE + '?action=exchange', { method:'POST', headers, body: JSON.stringify({ code, state }) })
      .then(r => r.json())
      .then(d => {
        // console_token : session de la console d'ig-review.html (commentaires + messages du compte qui vient de se connecter)
        notify({ ok:!!d.ok, ig_id:d.ig_id, username:d.username, preview:d.preview || null, console_token:d.console_token || null, error:d.error });
        if (d.ok) {
          const pv = d.preview || {};
          const stats = (pv.followers_count != null)
            ? '<p class="muted" style="margin-top:10px">' + fmtN(pv.followers_count) + ' followers · ' + (pv.media_count ?? '—') + ' posts'
              + (pv.reach_28j != null ? ' · 28-day reach: ' + fmtN(pv.reach_28j) : '') + '</p>'
            : '';
          // saved === false : relecteur Meta (aperçu seulement, compte non enregistré)
          const line = d.saved === false
            ? '<b>@' + esc(d.username || d.ig_id) + '</b>: access granted. You can close this window.'
            : '<b>@' + esc(d.username || d.ig_id) + '</b> is connected to AvatarAds. You can close this window.';
          show(CHECK + '<h1>Account connected</h1><p class="muted">' + line + '</p>' + stats);
        }
        else show(CROSS + '<h1>Error</h1><p class="muted">' + esc(d.error || 'unknown') + '</p>');
      })
      .catch(e => {
        notify({ ok:false, error:e.message });
        show(CROSS + '<h1>Error</h1><p class="muted">' + esc(e.message) + '</p>');
      });
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtN(n){ n=+n||0; return n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k' : String(n); }
</script>
</body>
</html>
