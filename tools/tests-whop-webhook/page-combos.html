<!doctype html><html><head><meta charset="utf-8"><title>test paiement</title></head><body style="margin:0">
<iframe id="f" style="width:1400px;height:1000px;border:0"></iframe>
<script>
// Vérité Whop (API, 23/10 après mises à jour) : id → [initial_price, renewal_price, palier, pack, rythme]
const W={
 plan_YKcdyPT6RRQSi:[0,29.99,"starter","","m"],plan_g4BVtDmk6hgjQ:[0,49.99,"pro","","m"],plan_w8lh5zpEJFOQR:[0,89.99,"elite","","m"],
 plan_pZmWh1dVdmIWT:[0,158.99,"elite60","","m"],plan_63PGeG3MesbJR:[0,224.99,"elite90","","m"],
 plan_cNydK89X39PLE:[0,249.99,"starter","","y"],plan_P7WIywSa6YrxT:[0,449.99,"pro","","y"],plan_OvRwm5CW3xcNh:[0,799.99,"elite","","y"],
 plan_uWTkJDl1GvxNR:[0,1439.88,"elite60","","y"],plan_x2kDWR6ur2W5E:[0,1895.88,"elite90","","y"],
 plan_blQtyUh90R2wP:[14.99,29.99,"starter","S","m"],plan_hE8bkwTPoTkrj:[14.99,49.99,"pro","S","m"],plan_0iHH0kY3uoJpo:[27.99,49.99,"pro","M","m"],
 plan_wn7ZntgBemFL0:[27.99,89.99,"elite","M","m"],plan_i7ubxuFfVHQ5k:[59.99,89.99,"elite","L","m"],plan_th1REeLIfRP50:[59.99,158.99,"elite60","L","m"],
 plan_xN9BOWCvFUWXp:[59.99,224.99,"elite90","L","m"],
 plan_NcMairMUEz3ST:[14.99,249.99,"starter","S","y"],plan_iATzKyUuANyfI:[14.99,449.99,"pro","S","y"],plan_QF7HXCR81yXRy:[27.99,449.99,"pro","M","y"],
 plan_5RTUZOJ3sGCXd:[27.99,799.99,"elite","M","y"],plan_QaAyO2Msc11Xk:[59.99,799.99,"elite","L","y"],plan_tAKWwP8U88eTT:[59.99,1439.88,"elite60","L","y"],
 plan_xzr5jL4TCAlWf:[59.99,1895.88,"elite90","L","y"]};
const PRIO={m:["plan_5mcgIdN0ZTlCG",5],y:["plan_2KlnrycFeoXMT",60],y3ds:["plan_oPv9MNE8701Tt",60]}, NEXT={starter:"pro",pro:"elite",elite:"elite60",elite60:"elite90"}, PK={starter:"S",pro:"M",elite:"L",elite60:"L",elite90:"L"};
const PRIX={S:[14.99,19.99],M:[27.99,34.99],L:[59.99,74.99]};
const combos=[]; for(const b of Object.keys(PK)) for(const bill of ["m","y"]) for(const up of NEXT[b]?[0,1]:[0]) for(const pk of [0,1]) for(const pr of [0,1]) combos.push({b,bill,up,pk,pr});
const eur=t=>parseFloat(String(t).replace(/[^\d,]/g,"").replace(",","."));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.__res=[]; window.__fini=false;
(async()=>{
 const f=document.getElementById("f");
 for(const [i,c] of combos.entries()){
  await new Promise(r=>{f.onload=r; f.src=`/paiement.html?plan=${c.b}&bill=${c.bill}&t=${i}`;});
  const w=f.contentWindow, d=f.contentDocument, clic=id=>{const e=d.querySelector(`[data-id="${id}"]`); if(e) e.click(); return !!e};
  await sleep(300);
  const ids=[...d.querySelectorAll("#opts .addon")].map(a=>a.dataset.id).join(",");
  const attenduIds=[NEXT[c.b]?"upgrade":"","credits","prio"].filter(Boolean).join(",");
  const err=[];
  if(ids!==attenduIds) err.push(`options ${ids} ≠ ${attenduIds}`);
  const pkTxt=d.querySelector('[data-id="credits"] .price')?.textContent||"";
  if(!pkTxt.includes(PRIX[PK[c.b]][0].toFixed(2).replace(".",","))||!pkTxt.includes(PRIX[PK[c.b]][1].toFixed(2).replace(".",","))) err.push(`prix pack affiché « ${pkTxt} »`);
  if(c.up&&!clic("upgrade")) err.push("pas d'upgrade"); if(c.pk&&!clic("credits")) err.push("pas de pack"); if(c.pr&&!clic("prio")) err.push("pas de prio");
  const plan=w.planWhop(), key=w.cartKey(), wt=W[plan], tier=c.up?NEXT[c.b]:c.b;
  if(!wt) err.push("plan inconnu "+plan);
  else { if(wt[2]!==tier) err.push(`palier ${wt[2]} ≠ ${tier}`); if(wt[3]!==(c.pk?PK[c.b]:"")) err.push(`pack ${wt[3]||"aucun"} ≠ ${c.pk?PK[c.b]:"aucun"}`); if(wt[4]!==c.bill) err.push("rythme "+wt[4]); }
  const pq=c.bill==="y"&&(tier==="elite60"||tier==="elite90")?PRIO.y3ds:PRIO[c.bill]; if((key.split("|")[1]||"")!==(c.pr?pq[0]:"")) err.push("prio dans le panier ≠ case");
  const du=eur(d.querySelector("#rPlan .due span:last-child").textContent), duM=eur(d.querySelector("#mSum .due span:last-child").textContent);
  const attendu=wt?Math.round((wt[0]+wt[1]+(c.pr?PRIO[c.bill][1]:0))*100)/100:NaN;
  if(Math.abs(du-attendu)>0.001||Math.abs(duM-attendu)>0.001) err.push(`total ${du} / mobile ${duM} ≠ Whop ${attendu}`);
  // module Whop : prêt (pas de fallback) en 20 s max
  let etat="attente"; for(let k=0;k<80;k++){ await sleep(250); const box=d.getElementById("co");
   if(box.innerText.includes("ne s'affiche pas")){etat="REFUSÉ";break}
   if(!box.querySelector(".whop-wait")&&[...box.querySelectorAll("iframe")].some(x=>x.getBoundingClientRect().height>200)){etat="ok";break} }
  if(etat!=="ok") err.push("module Whop : "+etat);
  window.__res.push({i,...c,plan,total:du,attendu,etat,err});
 }
 window.__fini=true;
})();
</script></body></html>
