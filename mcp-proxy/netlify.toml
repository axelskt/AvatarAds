# ─────────────────────────────────────────────────────────────────────────────
# RELAIS MCP — pourquoi ce site existe
#
# Le connecteur Claude refusait de se connecter : « Impossible de s'inscrire
# auprès du service de connexion de AvatarAds ». Ce n'était pas notre code.
#
# Claude sonde l'emplacement standard RFC 9728 pour savoir si une ressource est
# protégée par OAuth :
#     https://<hôte>/.well-known/oauth-protected-resource/<chemin-de-la-ressource>
# Sur supabase.co, c'est la PASSERELLE Supabase qui répond — jamais notre edge
# function — et elle renvoie 401 « No API key found in request ». Un 401 à cet
# endroit signifie « oui, OAuth » : Claude enchaîne sur l'inscription dynamique
# du client (RFC 7591), que nous n'avons pas, et échoue.
#
# Impossible à corriger depuis la fonction : la requête ne l'atteint jamais.
# D'où ce relais sur NOTRE domaine, où l'on contrôle ces chemins.
# ─────────────────────────────────────────────────────────────────────────────

# 1) LES SONDES OAUTH RÉPONDENT 404. C'est tout l'objet du relais : un 404 dit
#    « pas d'OAuth ici », et Claude accepte alors l'URL à clé telle quelle.
#    Cette règle est AVANT le relais général — Netlify applique dans l'ordre.
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404
  force = true

# 2) tout le reste part vers l'edge function, méthode et corps préservés
#    (status 200 = relais, pas redirection : le client ne voit qu'un seul hôte)
[[redirects]]
  from = "/*"
  to = "https://guvwgiejzkiodghywpwj.supabase.co/functions/v1/mcp/:splat"
  status = 200
  force = true
