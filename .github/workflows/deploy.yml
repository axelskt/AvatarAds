name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Réglage officiel GitHub Pages : on NE PAS annuler un déploiement en cours,
# sinon Pages reste bloqué en "pending" et le run suivant échoue ("Deployment failed, try again later").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # ON NE PUBLIE QUE LE SITE. `path: .` envoyait TOUT le dépôt suivi — 171 Mo,
      # dont 118 Mo de `render-worker/` qui tourne sur Railway et n'a rien à faire
      # sur un site web. Un artefact de cette taille finit par échouer côté service
      # d'artefacts (run #451 : « Upload artifact » en erreur, le même contenu étant
      # passé au run précédent). On assemble donc un `_site/` avec ce qui est
      # réellement servi : trois fois plus léger, et plus rien qui traîne en public.
      - name: Assembler le site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='render-worker' --exclude='supabase' --exclude='tools' \
                --exclude='.agents' --exclude='.claude' --exclude='.anim-check' \
                --exclude='clips' --exclude='Musique' --exclude='stories' \
                --exclude='deploy-orchestrate.sh' --exclude='.DS_Store' \
                --exclude='mcp-proxy' --exclude='skills-lock.json' \
                ./ _site/
          echo "poids publié : $(du -sh _site | cut -f1)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
